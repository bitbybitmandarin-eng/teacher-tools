<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f2eadc" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Timer" />

<title></title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="art" aria-hidden="true">
    <div class="shape orb-a"></div>
    <div class="shape orb-b"></div>
    <div class="shape orb-c"></div>
    <div class="shape petal"></div>
    <div class="shape slash"></div>
    <div class="rings"></div>
  </div>
  <div class="veil" aria-hidden="true"></div>

  <div class="shell">
    <header>
      <div class="tab-switch" aria-label="View">
        <button class="tab-btn active" id="timerTabBtn" type="button">Timer</button>
        <button class="tab-btn" id="todayTabBtn" type="button">Today</button>
        <button class="tab-btn" id="weekTabBtn" type="button">Week</button>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <div class="walk-chip" title="Next movement reminder">
          <span class="walk-icon">🚶</span>
          <span id="walkCountdown">30:00</span>
        </div>
        <button class="sound-btn" id="soundBtn" type="button" aria-label="Mute sounds" title="Mute sounds">♪</button>
      </div>
    </header>

    <main class="view active" id="timerView">
      <div class="timer-disc" id="timerDisc">
        <div class="progress" id="progress"></div>
        <div id="countdown" aria-label="Timer">20:00</div>
      </div>

      <div class="controls">
        <button class="btn add-time" data-add="3600">+1 hr</button>
        <button class="btn add-time" data-add="2400">+40 min</button>
        <button class="btn add-time" data-add="1200">+20 min</button>
        <button class="btn add-time" data-add="300">+5 min</button>
        <input class="target-time" id="targetTime" type="time" aria-label="Target time" />
        <button class="btn" id="targetBtn">To time</button>
        <button class="btn primary" id="startPauseBtn">Start</button>
        <button class="btn" id="resetBtn">Reset</button>
      </div>

      <div class="schedule-row">
        <div class="week-toggle" aria-label="Current timetable week">
          <button class="week-btn" id="oddWeekBtn" type="button">Odd</button>
          <button class="week-btn" id="evenWeekBtn" type="button">Even</button>
        </div>
        <button class="btn next-lesson-btn" id="nextLessonBtn" type="button">Next lesson</button>
        <div class="lesson-chip" id="lessonChip"></div>
      </div>
    </main>

    <main class="view day-view" id="dayView">
      <div class="day-top">
        <section class="now-card">
          <div class="lesson-auto-timer" id="lessonAutoTimer" aria-label="Countdown to end of lesson" title="Time to lesson end"></div>
          <div class="now-time" id="dayNowTime">--:--</div>
          <div class="now-state" id="dayNowState"></div>
          <div class="now-detail" id="dayNowDetail"></div>
        </section>
        <section class="day-track-card">
          <div class="day-meta">
            <span id="dayMeta"></span>
            <span id="dayLessonCount"></span>
          </div>
          <div class="timeline" id="dayTimeline">
            <div class="now-marker" id="dayNowMarker"></div>
          </div>
          <div class="track-times"><span>07:35</span><span>16:20</span></div>
        </section>
      </div>
      <section class="lesson-list" id="dayLessonList"></section>
      <section class="future-days" id="futureDays"></section>
    </main>

    <main class="view" id="weekView">
      <div class="week-scroll">
        <div class="week-board" id="weekBoard"></div>
      </div>
    </main>
  </div>

  <div class="walk-toast" id="walkToast">Stand up · walk around</div>

<script src="app.js"></script>
</body>
</html>
