name: Build classroom timer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild exact classroom timer HTML
        shell: bash
        run: |
          : > class-timer-live.html
          for f in class-timer-src/chunk*.b64; do
            base64 --decode "$f" >> class-timer-live.html
          done

      - name: Publish reconstructed file to repository
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add class-timer-live.html
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Build classroom timer live HTML"
            git push
          fi
