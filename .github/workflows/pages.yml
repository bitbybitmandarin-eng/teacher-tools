name: Publish classroom timer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Rebuild classroom timer
        shell: bash
        run: |
          mkdir -p _site/class-timer
          : > _site/class-timer/index.html
          for f in class-timer-src/chunk*.b64; do
            base64 --decode "$f" >> _site/class-timer/index.html
          done
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./class-timer/"><title></title>
          EOF

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
